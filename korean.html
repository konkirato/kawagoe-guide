<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>엔에서 원으로 환산</title>
    <link rel="stylesheet" href="money.css"> 
</head>
<body>
    <div class="container">
        <h1>엔에서 원으로 환산</h1>
        
        <label for="exchangeRate">환율 (1 JPY = KRW): </label>
        <input type="number" id="exchangeRate" placeholder="환율을 입력하세요" step="0.001">
        
        <label for="yen">일본 엔 (JPY): </label>
        <input type="number" id="yen" placeholder="엔을 입력하세요">
        
        <button onclick="convertToUSD()">환산하다</button>
        <p id="result"></p>

        <button class="bottom-button" onclick="location.href='kankoku.html'">음성 재생 버튼</button>
    </div>

    <script src="korean.js"></script>
</body>
</html>
