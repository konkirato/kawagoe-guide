<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日元兑换成人民币</title>
    <link rel="stylesheet" href="money.css"> 
</head>
<body>
    <div class="container">
        <h1>日元兑换成人民币</h1>
        
        <label for="exchangeRate">汇率 (1 JPY = CNY): </label>
        <input type="number" id="exchangeRate" placeholder="请输入汇率" step="0.0001">
        
        <label for="yen">日元 (JPY): </label>
        <input type="number" id="yen" placeholder="输入日元金额">
        
        <button onclick="convertToUSD()">转换</button>
        <p id="result"></p>
    </div>

    <button class="bottom-button" onclick="location.href='china.html'">音频播放按钮</button>

    <script src="chinese.js"></script> 
</body>
</html>
